# Cache-Control por ruta, resuelto una sola vez. Así ningún location necesita
# su propio add_header y los headers de seguridad del bloque server se heredan
# en todos (un add_header en un location descarta los del padre).
# Prioridad de nginx en un map: string exacto > regex en orden de aparición.
# Por eso workbox va antes que la regla general de .js.
map $uri $cache_control_por_ruta {
    default                                       "no-store, must-revalidate";
    /sw.js                                        "no-store, must-revalidate";
    /version.json                                 "no-store, must-revalidate";
    /manifest.webmanifest                         "public, max-age=3600";
    ~^/workbox-.*\.js$                            "no-store, must-revalidate";
    ~*\.(?:js|css)$                               "public, max-age=31536000, immutable";
    ~*\.(?:png|jpg|jpeg|gif|ico|svg|woff|woff2)$  "public, max-age=2592000";
}
# Un error (404 de un chunk que no existe) nunca se cachea: sin esto, un .js
# inexistente salía con el `immutable` de su extensión y el navegador se quedaba
# un año con el 404.
map $status $cache_control {
    ~^[45]  "no-store";
    default $cache_control_por_ruta;
}
# Vacío = nginx no manda el header. Sólo el service worker lo lleva.
map $uri $sw_allowed {
    default "";
    /sw.js  "/";
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $cache_control always;
    add_header Service-Worker-Allowed $sw_allowed always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://maps.googleapis.com blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.google.com https://*.googleusercontent.com https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; connect-src 'self' https://*.supabase.co https://*.supabase.in wss://*.supabase.co https://*.googleapis.com https://*.gstatic.com https://*.sentry.io; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Sin esto el manifest sale como application/octet-stream.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Un chunk o un asset que no existe es un 404, no el index.html con 200: un
    # navegador con la app vieja pide los chunks del build anterior, y con
    # `try_files … /index.html` recibía HTML con 200 y content-type text/html, que
    # el service worker (StaleWhileRevalidate sobre .js/.css) guardaba como si
    # fuera el script (#1600, 1600-b13). Con 404 no lo guarda y el error de carga
    # del chunk lo ve la app. El `$cache_control` de los 404 sale no-store (ver el
    # map de arriba).
    location /assets/ {
        try_files $uri =404;
    }

    # SPA: todas las rutas van a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
