name: Deploy Edge Functions

# Deploy de las edge functions de Supabase.
#
# POR QUÉ EXISTE
# --------------
# Hasta ahora se deployaban a mano desde la máquina de quien tocara el código
# (el `entrypoint_path` de las funciones vivas apunta a un worktree local). Eso
# hace que el repo y lo desplegado driftteen sin que nadie se entere: el 12/08
# `telegram-webhook` corría la versión del 28/07, seis días atrás del arreglo ya
# mergeado en `main`, y eso bloqueaba la migración 169 — que borra una columna
# que la versión vieja todavía seleccionaba.
#
# El drift no avisa: la función sigue respondiendo, sólo que con código viejo.
#
# CI (`ci.yml`) ya corre `deno task check` y `deno task lint` sobre
# `supabase/functions/**` en cada PR. Este workflow es el paso que faltaba:
# publicar lo que quedó en `main`.
#
# SECRET REQUERIDO
# ----------------
#   SUPABASE_ACCESS_TOKEN — token personal de Supabase (empieza con `sbp_`).
#   Se genera en https://supabase.com/dashboard/account/tokens y se carga en
#   Settings → Secrets and variables → Actions del repo.
#
# `verify_jwt` NO se pasa por flag: sale de `supabase/config.toml`, que ya lo
# deja en false para telegram-webhook y telegram-digest. Pisarlo acá haría que
# Telegram (que no manda JWT) empiece a comerse 401.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:
    inputs:
      funcion:
        description: 'Función a deployar (vacío = todas)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - telegram-webhook
          - telegram-digest
          - optimizar-ruta

env:
  # No es un secreto: ya está en migrations/MANIFEST.md y en la URL pública del
  # proyecto. Como secret sólo agregaría un lugar más donde puede desactualizarse.
  PROJECT_REF: hmuchlzmuqqxcldbzkgc

jobs:
  deploy:
    name: Deploy a Supabase
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Puerta antes de publicar. `main` ya pasó por CI, pero un deploy manual
      # (workflow_dispatch) puede dispararse sobre cualquier estado del branch,
      # y publicar algo que no typechequea es peor que no publicar.
      - name: Typecheck
        working-directory: supabase/functions
        run: deno task check

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FUNCION: ${{ github.event.inputs.funcion }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Falta el secret SUPABASE_ACCESS_TOKEN. Ver el encabezado de este workflow."
            exit 1
          fi

          if [ -n "${FUNCION}" ]; then
            echo "Deployando sólo ${FUNCION}"
            supabase functions deploy "${FUNCION}" --project-ref "${PROJECT_REF}"
          else
            echo "Deployando todas las funciones"
            supabase functions deploy --project-ref "${PROJECT_REF}"
          fi

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Deploy de edge functions"
            echo ""
            echo "- Proyecto: \`${PROJECT_REF}\`"
            echo "- Función: \`${FUNCION:-todas}\`"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Resultado: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          FUNCION: ${{ github.event.inputs.funcion }}
