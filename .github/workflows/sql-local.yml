name: SQL local

# Los gates de SQL y los ensayos de SQL sobre una base LOCAL, en cada PR que toca SQL (#1601
# 1601-b7, #1563 1563-b9, decisión D60 del dueño: «los ensayos de SQL se suman a CI sobre una
# base local»). Antes los gates corrían sólo en el cron de las 08:00 contra prod
# (integridad.yml) y los ensayos no corrían en ningún lado: un PR que abría una función se
# mergeaba, y se enteraba al día siguiente (o nunca).
#
# Qué hace:
#   1. Restaura la foto del ESQUEMA de prod que deja esquema-base.yml (sin datos).
#   2. Levanta Postgres 17.6 en Docker (la imagen de Supabase, la misma versión de prod),
#      le carga esa foto, la semilla (admin y sucursales 1 y 2) y las migraciones pendientes
#      del PR (migrations/NNN_*.sql, con el NNN literal: las que todavía no tienen número).
#   3. Corre los gates (scripts/ci/gates-locales.sh): los mismos scripts del cron, apuntados
#      a un PostgREST de juguete, más los que leen el catálogo (Realtime, mensajes de error
#      de los triggers, cruce por ids de otra sucursal).
#   4. Corre los ensayos (scripts/ci/ensayos-sql.mjs: todos los scripts/test-*.sql, salvo los
#      de scripts/ensayos-sql-excepciones.json).
#
# No usa ningún secret: puede correr en PRs de forks. Cuánto tarda: unos 8 a 15 minutos
# (bajar la imagen de Postgres ~1 min, cargar el esquema ~1 min, los gates ~2 min y los
# ensayos el resto). Corre sólo si el PR toca migrations/, scripts/ o estos workflows, y en
# cada push a main que los toque.
#
# Hasta que esquema-base.yml haya corrido una vez (se dispara a mano la primera vez) no hay
# foto que restaurar, y el job FALLA diciendo cómo generarla (un gate que no puede mirar es rojo,
# no verde). También falla si la foto tiene más de 48 horas.

on:
  pull_request:
    paths:
      - 'migrations/**'
      - 'scripts/**'
      - '.github/workflows/sql-local.yml'
      - '.github/workflows/esquema-base.yml'
  push:
    branches: [main]
    paths:
      - 'migrations/**'
      - 'scripts/**'
      - '.github/workflows/sql-local.yml'
      - '.github/workflows/esquema-base.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sql-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql-local:
    name: Gates y ensayos de SQL
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CONC_NOMBRE: ci-sql
      CONC_PUERTO: '54430'
      GATE_DB_CONTENEDOR: ci-sql
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restaurar la foto del esquema de prod
        id: foto
        uses: actions/cache/restore@v4
        with:
          path: esquema-base
          key: esquema-prod-ninguna-exacta
          restore-keys: esquema-prod-

      # Sin foto el job NO puede mirar nada, y un gate que no puede mirar es ROJO, no verde: un
      # tilde sin haber corrido nada se lee como «verificado» (el mismo error de las 52 corridas de
      # integridad.yml sin secrets). Pasa hasta que alguien dispara «Esquema base» por primera vez, y
      # de nuevo si GitHub desaloja el cache (lo hace a los 7 días sin uso).
      - name: Sin foto del esquema
        if: steps.foto.outputs.cache-matched-key == ''
        run: |
          echo "::error::No hay foto del esquema de prod en el cache, así que este PR NO pudo correr los gates ni los ensayos de SQL. Generarla: Actions > «Esquema base» > Run workflow (tarda un minuto), y después volver a correr este job."
          exit 1

      # Una foto vieja no es una foto buena: si «Esquema base» falla todos los días (secret rotado,
      # cron apagado por inactividad) el cache sigue devolviendo la última que hubo, cada PR la
      # mantiene viva y nadie se entera. Pasadas 48 horas, rojo.
      - name: La foto es de las últimas 48 horas
        if: steps.foto.outputs.cache-matched-key != ''
        run: |
          if [ ! -f esquema-base/generado.txt ]; then
            echo "::error::La foto no dice cuándo se tomó (esquema-base/generado.txt): es de una versión vieja de «Esquema base». Volver a generarla (Actions > «Esquema base» > Run workflow)."
            exit 1
          fi
          edad=$(( $(date -u +%s) - $(cat esquema-base/generado.txt) ))
          echo "foto: ${{ steps.foto.outputs.cache-matched-key }} · tomada hace $((edad / 3600)) h"
          echo "ledger de prod: $(wc -l < esquema-base/ledger.txt) migraciones, última $(tail -n1 esquema-base/ledger.txt)"
          if [ "$edad" -gt 172800 ]; then
            echo "::error::La foto del esquema tiene $((edad / 3600)) horas (el límite es 48): «Esquema base» no está corriendo. Mirar sus últimas corridas (¿falló el secret SUPABASE_DB_URL?) y dispararlo a mano."
            exit 1
          fi

      - name: Levantar Postgres local
        if: steps.foto.outputs.cache-matched-key != ''
        run: node scripts/concurrencia/docker-local.mjs up

      # La foto es `pg_dump -n public`: no trae las extensiones. `unaccent` vive en public
      # en prod y varias funciones la llaman; el resto (pgcrypto, uuid-ossp, vault) las trae
      # la imagen.
      - name: Cargar el esquema y la semilla
        if: steps.foto.outputs.cache-matched-key != ''
        run: |
          set -euo pipefail
          node scripts/concurrencia/docker-local.mjs sql "CREATE EXTENSION IF NOT EXISTS unaccent WITH SCHEMA public"
          node scripts/concurrencia/docker-local.mjs dump esquema-base/esquema.sql | tee /tmp/carga.log
          # Los únicos errores tolerados: el CREATE SCHEMA public (ya existe) y los privilegios
          # por defecto de supabase_admin (pg_dump los incluye y postgres no puede cambiarlos).
          MALOS=$(grep -E 'ERROR|FATAL' /tmp/carga.log | grep -v -E 'schema "public" already exists|permission denied to change default privileges' || true)
          if [ -n "$MALOS" ]; then
            echo "::error::La carga del esquema falló:"
            echo "$MALOS"
            exit 1
          fi
          node scripts/concurrencia/docker-local.mjs semilla

      # Usuarios de cada rol, clientes y productos inventados en las sucursales 1 y 2: muchos
      # ensayos arrancan pidiendo «una sucursal con admin, preventista y transportista». Va
      # ANTES de las migraciones del PR, como en prod: una columna NOT NULL sin default que
      # se agrega con filas existentes tiene que fallar acá igual que allá.
      - name: Datos mínimos para los ensayos
        if: steps.foto.outputs.cache-matched-key != ''
        run: docker exec -i ci-sql psql -U postgres -h localhost -d postgres -X -q -v ON_ERROR_STOP=1 < scripts/ci/semilla-ensayos.sql

      # El volcado sin datos reinicia las secuencias en 1 y hace pasar CHECKs que apoyan en un id de
      # prod (pagos_client_request_id_historico: id <= 8049). Con 10^9 los ids nuevos quedan por
      # encima de cualquier id histórico, como en prod.
      - name: Secuencias altas
        if: steps.foto.outputs.cache-matched-key != ''
        run: docker exec -i ci-sql psql -U postgres -h localhost -d postgres -X -q -v ON_ERROR_STOP=1 < scripts/ci/secuencias-altas.sql

      # Dos grupos, en este orden: (1) las migraciones NUMERADAS de migrations/ que la foto no tiene
      # (se aplicaron a prod después de las 07:30 y su archivo ya entró a main: sin esto sus ensayos
      # corren contra un esquema sin ellas y todo queda rojo hasta mañana), y (2) las `NNN_*.sql` con
      # el número literal, que son las del PR. El PR tiene que estar al día con main.
      - name: Aplicar las migraciones que la foto no tiene
        id: migr
        if: steps.foto.outputs.cache-matched-key != ''
        run: |
          set -euo pipefail
          node scripts/ci/migraciones-pendientes.mjs esquema-base/ledger.txt > /tmp/pendientes.txt
          n=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "== aplicando $f"
            node scripts/concurrencia/docker-local.mjs aplicar "$f"
            n=$((n+1))
          done < /tmp/pendientes.txt
          echo "migraciones aplicadas sobre la foto: $n"

      - name: Gates de SQL
        id: gates
        if: steps.foto.outputs.cache-matched-key != ''
        run: bash scripts/ci/gates-locales.sh

      # Cada gate nuevo o endurecido se prueba contra el defecto que vigila (un gate que nunca
      # falla no sirve): se arma, se comprueba que da rojo y se deshace. Va después de los gates
      # y antes de los ensayos, que tienen que ver la base como estaba.
      - name: Los gates muerden (controles negativos)
        if: always() && steps.migr.outcome == 'success'
        run: bash scripts/ci/gates-muerden.sh

      - name: Ensayos de SQL
        # Corre aunque los gates hayan fallado (una corrida dice todo lo que está mal), pero no
        # si la base no se armó.
        if: always() && steps.migr.outcome == 'success'
        run: node scripts/ci/ensayos-sql.mjs

      - name: Apagar Postgres local
        if: always() && steps.foto.outputs.cache-matched-key != ''
        run: node scripts/concurrencia/docker-local.mjs down
