name: Integridad de datos

# Gate de integridad (Capa 3 del plan docs/archive/2026-06-29-plan-auditoria-integridad.md).
# Corre auditoria_integridad() contra prod y falla si hay checks critical/high
# en rojo. Diario + a demanda. Requiere los secrets SUPABASE_URL y
# SUPABASE_SERVICE_ROLE_KEY (service_role, NO la anon key).

on:
  schedule:
    - cron: '0 11 * * *' # 08:00 ART (11:00 UTC), todos los días
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  auditoria-integridad:
    name: Auditoría de integridad
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Un solo lugar donde se verifica que los secrets estén, y FALLA si no.
      #
      # Antes cada paso traía su propio `if [ -z ... ]; then warning; exit 0; fi`.
      # Los secrets nunca existieron —el repo tiene SUPABASE_DB_URL y
      # SUPABASE_ACCESS_TOKEN, no estos dos— así que las 52 corridas entre el
      # 2026-06-30 y el 2026-08-19 salieron VERDES sin chequear una sola cosa, en
      # 15 segundos: checkout, setup y cuatro warnings que nadie mira. Un gate que
      # da luz verde cuando no puede mirar es peor que no tener gate, porque el
      # tilde verde se lee como "verificado".
      #
      # Este paso convierte "no puedo chequear" en rojo, que es lo que es. Y al
      # estar una sola vez, el paso que agregue el próximo no puede nacer con el
      # bug de vuelta.
      #
      # No hay caso legítimo de correr esto sin secrets: el workflow sólo dispara
      # por `schedule` y `workflow_dispatch` sobre el repo de origen. No corre en
      # forks ni en PRs.
      - name: Verificar que los secrets estén configurados
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          faltan=""
          [ -z "$SUPABASE_URL" ] && faltan="$faltan SUPABASE_URL"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && faltan="$faltan SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$faltan" ]; then
            echo "::error::Faltan los secrets:$faltan — el gate NO puede correr y por eso falla."
            echo "Cargalos en Settings > Secrets and variables > Actions."
            echo "SUPABASE_SERVICE_ROLE_KEY es la service_role key (Settings > API en Supabase), NO la anon."
            exit 1
          fi
          echo "Secrets presentes. Corriendo los cuatro chequeos contra prod."

      # Los cuatro van con `if: always()` para que una corrida diga TODO lo que
      # está mal de una vez, en vez de esconder los tres siguientes detrás del
      # primero que falle. Si el paso de arriba falló, igual corren y mueren solos
      # con "Faltan SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY" (exit 2): ruidoso a
      # propósito, que es lo contrario de lo que hacían antes.
      - name: Correr batería de invariantes
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-integridad.mjs

      - name: Aislamiento por sucursal (FK compuestas)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-sucursal-cruzada.mjs

      - name: Drift-check de migraciones (repo vs prod)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-migrations.mjs

      # Falla si alguna función de public volvió a quedar ejecutable con la anon
      # key, o una de trigger con la app (#1245). Ver migrations/188, la 405 y
      # migrations/README.md § Permisos.
      - name: Permisos EXECUTE (nada abierto a anon, triggers sin EXECUTE)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-permisos.mjs

      # El signup cerrado y el alta que no le cree al usuario (#1243): con el
      # signup abierto y handle_new_user() leyendo el rol de raw_user_meta_data,
      # cualquiera con la anon key se registraba como admin. Un proyecto nuevo
      # de Supabase nace con el signup abierto. Ver migrations/403b.
      - name: Auth (signup cerrado, el alta no lee el metadata del usuario)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-auth.mjs

      # Toda rama admin de una policy mira la sucursal (#1244): el admin de una
      # sucursal desactivaba por REST a los usuarios de la otra. Ver
      # migrations/404.
      - name: Rama admin de las policies (acotada a la sucursal)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-rama-admin.mjs

      # El de arriba mira funciones; éste mira TABLAS. `perfiles` estuvo legible
      # con la anon key durante meses sin que ningún gate lo viera. Ver
      # migrations/228.
      - name: Lectura anónima de tablas (nada abierto a anon)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-tablas-anon.mjs

      # El de arriba mira si anon LEE; éste mira qué GRANTS de tabla quedan. anon
      # no tiene nada, y authenticated escribe por REST exactamente lo de
      # scripts/grants-rest.json, con su nivel (tabla o columnas). Por las
      # escrituras de más se podía falsear el ledger de stock (#1134) o tocar
      # pagos, mermas y alícuotas salteando sus RPC (#1135).
      - name: Grants de tabla (anon nada, authenticated sólo lo del JSON)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-grants-tablas.mjs

      # Cada select de la app con un embed, probado contra PostgREST con limit=0.
      # Las FKs de aislamiento por sucursal son compuestas y un hint por nombre de
      # columna (`productos!producto_id`) da PGRST200: tumbó Salvedades (#1008). El
      # select es un string; tsc, eslint y los tests no lo ven. Corre con la
      # service_role del job (resuelve las mismas relaciones que la anon).
      - name: Embeds de PostgREST (selects de src/ y supabase/functions/)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-embeds.mjs

      # El recorrido de la cadena de sustituciones de regalo está escrito dos
      # veces: `pasosDeCadena` (TS, la pantalla de edición) y
      # `regalo_cadena_pasos` (SQL, lo que se guarda). Los dos corren los casos
      # de `src/utils/cadenaSustitucion.espejo.json`: el TS en vitest, el SQL
      # acá. Ver #1010. No necesita node_modules.
      - name: Paridad de la cadena de sustituciones de regalo (TS vs SQL)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/espejo-cadena-regalo.mjs

      # El tope del regalo de una promo está escrito dos veces:
      # `resolverPromociones` (TS, lo que el front regala) y `regalo_tope_promo`
      # (SQL, con lo que el server limita el regalo de quien no es admin). Los
      # dos corren los casos de `src/utils/topeRegalo.espejo.json`: el TS en
      # vitest, el SQL acá. Ver #1123. No necesita node_modules.
      - name: Paridad del tope de regalo (TS vs SQL)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/espejo-tope-regalo.mjs

      # La exclusión entre promos excluyentes está escrita dos veces:
      # `resolverPromociones` (TS, una sola ganadora por grupo, y el usuario puede
      # quitar promos) y `regalo_excluyentes_en_conflicto` (SQL, con la que el
      # server rechaza el regalo de dos excluyentes que comparten un producto
      # vendido). Los dos corren los casos de `src/utils/exclusionRegalo.espejo.json`:
      # el TS en vitest, el SQL acá. Ver #1136. No necesita node_modules.
      - name: Paridad de la exclusión de regalos (TS vs SQL)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/espejo-exclusion-regalo.mjs

      # El piso de precio de quien no es admin está escrito dos veces:
      # `orquestarPrecios` (TS, lo que cobra el front) y `precio_piso_linea`
      # (SQL, con lo que el server rechaza una línea de venta más barata). El
      # piso tiene que ser el del front o más bajo, nunca más alto. Los dos
      # corren los casos de `src/utils/pisoPrecio.espejo.json`: el TS en vitest,
      # el SQL acá. Ver #1139. No necesita node_modules.
      - name: Paridad del piso de precio (TS vs SQL)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/espejo-piso-precio.mjs

      # Los combos (#1191): el front los arma y el server los valida
      # recalculando el total, el reparto y la cantidad de combos. Las tres
      # puras están escritas dos veces (`src/utils/combos.ts` y
      # `_combo_total` / `_combo_prorrateo` / `_combo_cantidad`) y tienen que dar
      # lo mismo al centavo, o el server rechaza pedidos honestos. Los dos corren
      # `src/utils/combos.espejo.json`. No necesita node_modules.
      - name: Paridad de los combos (TS vs SQL)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/espejo-combos.mjs

      # El cargo de envío (#1220): el server decide el cargo al crear, lo
      # desglosa en neto/IVA y lo reconsidera al editar con tres puras
      # (`cargo_envio_pedido_puro` / `cargo_envio_desglose` /
      # `cargo_tras_edicion`), y el front las anticipa en
      # `src/utils/montoMinimo.ts` para avisar antes de confirmar. Si difieren,
      # el total que ve el preventista no es el que guarda la base. Los dos
      # corren `src/utils/cargoEnvio.espejo.json`. No necesita node_modules.
      - name: Paridad del cargo de envío (TS vs SQL)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/espejo-cargo-envio.mjs

      # El motor de costos de una compra está escrito dos veces —TypeScript para
      # la vista previa del modal, SQL para lo que se persiste— y las dos tienen
      # que dar el mismo número al centavo. Esto corre LAS DOS sobre los mismos
      # casos y deja que la comparación la haga Postgres.
      #
      # Va acá y no en la suite de vitest porque necesita la base. La contraparte
      # local y sin red es `src/utils/prorrateoCompra.espejo.test.ts`, que compara
      # el TS contra un fixture congelado y por eso NO ve si el que se movió fue
      # el SQL. Éste sí.
      #
      # Único paso que necesita node_modules: carga el motor de TypeScript con
      # Vite en vez de copiar la aritmética al script. Sin `if [ -z ... ] exit 0`
      # a propósito — el paso de secrets de arriba ya falla por todos.
      - name: Espejo del motor de compras (TS vs SQL)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npm ci --no-audit --no-fund
          node scripts/espejo-motor-compras.mjs
