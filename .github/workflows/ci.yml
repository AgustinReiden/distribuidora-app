name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # Cada select con embed, probado contra PostgREST de prod con limit=0 (#1008, #1018).
  # Usa la anon key, que es pública (viaja en el bundle), guardada como VARIABLE de
  # repo y no como secret; la service_role no se le da a un job que corre código del PR.
  # Sin node_modules: el script sólo usa módulos de Node. Si faltan las variables
  # FALLA (como el gate de integridad): un gate que no puede mirar no puede dar verde.
  embeds:
    name: Embeds de PostgREST
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verificar variables
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan las variables de repo SUPABASE_URL / SUPABASE_ANON_KEY (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi

      # Con la anon key no se puede leer qué columnas lee authenticated ni probar
      # como authenticated: los grants y la sesión los verifica integridad.yml
      # con la service_role y el JWT secret (#1256, #1417), que no se le dan a
      # un job que corre código del PR. Acá se prueban relaciones, columnas y
      # filtros sobre embeds.
      - name: Probar los embeds contra prod
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          EMBEDS_GRANTS: omitir
          EMBEDS_SESION: omitir
        run: node scripts/check-embeds.mjs

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    # La suite entera tarda entre 11 y 15 minutos: con 15 se cancelaba cada tanto sin que fallara
    # ningún test. Desde #1587 (D60) es el único lugar donde corre entera.
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  deno-changes:
    name: Detect Deno changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deno: ${{ steps.filter.outputs.deno }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            deno:
              - 'supabase/functions/**'
              - '.github/workflows/ci.yml'

  deno:
    name: Deno (supabase/functions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deno-changes]
    # The job itself always runs (returns success) so the downstream `build`
    # job (which has `needs: [..., deno]`) is not skipped when supabase/functions
    # is unchanged. The actual Deno checks only execute when there are changes.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: No changes — skip Deno checks
        if: needs.deno-changes.outputs.deno != 'true'
        run: echo "No changes in supabase/functions/** — skipping Deno checks."

      - name: Setup Deno
        if: needs.deno-changes.outputs.deno == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type check
        if: needs.deno-changes.outputs.deno == 'true'
        working-directory: supabase/functions
        run: deno task check

      - name: Lint
        if: needs.deno-changes.outputs.deno == 'true'
        working-directory: supabase/functions
        run: deno task lint

      - name: Test
        if: needs.deno-changes.outputs.deno == 'true'
        working-directory: supabase/functions
        run: deno task test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test, typecheck, security, deno]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-key' }}
          # Este dist/ es el que corre el job e2e: expone `window.__offlineDb`,
          # que el build de producción (Coolify) ya no tiene (#1264).
          VITE_E2E_BRIDGE: 'true'

      # Un archivo JS o CSS del build de más de 1 MiB es un ERROR (1563-b10, decisión del dueño): antes
      # sólo emitía un warning que nadie leía. Hoy ninguno lo pasa (el más grande, lib-excel, ronda
      # los 900 KB). Para subir el límite si algún día hace falta: cambiar LIMITE_BYTES acá abajo
      # (y decir en el PR por qué); para que un chunk grande deje de serlo, partirlo con
      # build.rollupOptions.output.manualChunks en vite.config.js o cargarlo con import() dinámico.
      - name: Check bundle size
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -sh dist/ >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          LIMITE_BYTES=1048576 # 1 MiB
          excedidos=0
          while IFS= read -r archivo; do
            bytes=$(stat -c%s "$archivo")
            if [ "$bytes" -gt "$LIMITE_BYTES" ]; then
              echo "::error file=$archivo::$archivo pesa $bytes bytes ($((bytes / 1024)) KiB) y el limite es $LIMITE_BYTES ($((LIMITE_BYTES / 1024)) KiB). Partilo (manualChunks / import dinamico) o subi LIMITE_BYTES en .github/workflows/ci.yml, explicando por que."
              excedidos=$((excedidos + 1))
            fi
          done < <(find dist/assets -type f \( -name '*.js' -o -name '*.css' \))
          if [ "$excedidos" -gt 0 ]; then
            echo "$excedidos archivo(s) del build pasan el limite de 1 MiB"
            exit 1
          fi
          echo "Ningun archivo JS o CSS del build pasa 1 MiB."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    # Los tests tardan ~75 s de forma consistente. El techo NO es para ellos: es
    # para que un cuelgue de infraestructura falle rapido en vez de simular que
    # trabaja. El 18/08 este job estuvo 48 minutos trabado en `apt-get update`
    # contra archive.ubuntu.com y sin timeout habria seguido hasta el limite de 6
    # horas de GitHub, quemando minutos y bloqueando el merge de un PR sano.
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # La version sale del lockfile instalado, no de package.json: el rango
      # ("^1.58.1") resolveria a binarios distintos con la misma clave de cache.
      - name: Resolver version de Playwright
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache de navegadores de Playwright
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        # Techo propio: es el paso que se cuelga, y el que se cuelga es el
        # `apt-get` de `--with-deps`, no la descarga de los binarios. Se mantiene
        # `--with-deps` a proposito: sacarlo evitaria el apt del todo, pero
        # apostaria a que la imagen del runner ya trae las librerias que chromium
        # necesita, y eso no esta verificado. Si el cuelgue se repite, ese es el
        # proximo paso.
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Run E2E tests
        run: npx playwright test --project=chromium
        env:
          CI: true
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-key' }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type checking
        run: npm run typecheck

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        # --omit=dev: audita solo dependencias de produccion (lo que llega al
        # usuario). Las devDependencies (vite/esbuild/plugin-react) generan
        # advisories de tooling que no aplican al bundle — p. ej.
        # GHSA-gv7w-rqvm-qjhr (instalador Deno de esbuild) bloqueaba el CI y
        # su unico fix es vite@8 (breaking, se evalua por separado).
        run: npm audit --audit-level=high --omit=dev

      # `--all`: en CI el índice está vacío, y sin esto el chequeo (que mira los archivos
      # staged, pensado para el pre-commit) no revisaba nada y salía verde (#1600, 1600-b2).
      - name: Check for secrets in code
        run: npm run check-secrets -- --all
