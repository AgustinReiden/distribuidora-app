name: Retención de avisos y auditoría

# Borra los avisos (`notificaciones`) de más de 90 días y el registro de
# auditoría (`audit_logs`) de más de 24 meses (1561-b10 y 1596-b10, plan #1603).
#
# POR QUÉ EXISTE
# --------------
# Ninguna de las dos tablas tenía retención: una carga de N productos sin
# precio genera N × (admins + encargados) avisos, y una venta de 20 líneas
# escribía 43 filas de auditoría. Decisión del dueño (D38, 15/11): avisos 90
# días, auditoría 24 meses. En prod no hay pg_cron (decisión del #661), así que
# este workflow llama `purgar_retencion()` una vez por día, en un bucle de
# lotes de 5.000 hasta que no quede nada (scripts/purgar-retencion.mjs).
#
# Nada más: `bot_audit_log` tiene su propia retención (mig 016), y ninguna otra
# tabla se purga. La migración que crea la función no borra nada: la primera
# corrida de este workflow es la que se lleva lo acumulado.
#
# CÓMO DETECTAR QUE DEJÓ DE CORRER
# ---------------------------------
#   gh run list --workflow=purgar-retencion.yml
#
# Usa los mismos secrets que `integridad.yml` (SUPABASE_URL y
# SUPABASE_SERVICE_ROLE_KEY): no hace falta cargar nada nuevo.

on:
  schedule:
    - cron: '45 3 * * *' # 00:45 ART (03:45 UTC), todos los días
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  purgar-retencion:
    name: Purgar avisos y auditoría viejos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Igual que en integridad.yml: sin secrets el paso FALLA. Una purga que
      # no corrió no puede salir verde.
      - name: Verificar que los secrets estén configurados
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          faltan=""
          [ -z "$SUPABASE_URL" ] && faltan="$faltan SUPABASE_URL"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && faltan="$faltan SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$faltan" ]; then
            echo "::error::Faltan los secrets:$faltan — la purga NO puede correr y por eso falla."
            echo "Cargalos en Settings > Secrets and variables > Actions."
            echo "SUPABASE_SERVICE_ROLE_KEY es la service_role key (Settings > API en Supabase), NO la anon."
            exit 1
          fi

      - name: Llamar purgar_retencion()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # pipefail: sin él, el `tee` taparía el exit 2 del script.
        run: |
          set -o pipefail
          node scripts/purgar-retencion.mjs | tee salida.txt

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Retención de avisos y auditoría"
            echo "- Resultado: **${{ job.status }}**"
            if [ -f salida.txt ]; then
              echo ""
              echo '```'
              cat salida.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
