name: Digest ejecutivo Telegram

# Dispara el digest ejecutivo diario para admins (edge function telegram-digest).
#
# POR QUÉ EXISTE
# --------------
# La migración 018 programaba el disparo con pg_cron + pg_net (SELECT
# cron.schedule(...) a las 10:00 UTC). Esas dos extensiones nunca estuvieron
# habilitadas en prod, así que el bloque quedó como no-op desde el día uno: el
# digest jamás corrió, ni una vez (`bot_digests_enviados` vacía). Ver #661.
#
# Decisión: no instalar pg_cron. Este workflow reemplaza el cron de Postgres
# usando infraestructura que ya existe y que sí falla visible — como
# `backup.yml` e `integridad.yml`.
#
# AUTENTICACIÓN
# --------------
# La edge function valida el header `X-Digest-Key` contra el secret
# TELEGRAM_DIGEST_KEY (ver supabase/functions/telegram-digest/index.ts), con
# comparación en tiempo constante. NO usa SUPABASE_SERVICE_ROLE_KEY: se probó
# primero con esa key (igual que hace `integridad.yml`) y dio 403 siempre —
# Supabase no deja setear a mano un secret de función con el prefijo
# SUPABASE_ (está reservado para el auto-injection de la plataforma, que para
# este proyecto no matcheaba lo que mandaba Actions y no había forma de
# diagnosticarlo desde afuera). TELEGRAM_DIGEST_KEY es un secret propio,
# cargado a mano tanto acá (GitHub) como en Supabase (Dashboard > Edge
# Functions > telegram-digest > Secrets) — mismo valor en los dos lugares.
#
# CÓMO DETECTAR QUE DEJÓ DE CORRER
# ---------------------------------
#   gh run list --workflow=telegram-digest.yml
# Un run rojo, o la ausencia de runs por varias horas, es la señal. También se
# puede confirmar contra la tabla `bot_digests_enviados` (1 fila por admin ×
# fecha × sucursal si corrió bien — una sola, aunque el workflow corra 24 veces: la
# idempotencia es (admin_perfil_id, fecha, sucursal_id) y la marca se toma antes
# de mandar, ver telegram-digest/marca.ts). El gate es el paso "Resumen diario
# del bot" de integridad.yml (#1309): falla si a alguien le tocaba un resumen y
# no le llegó.

on:
  schedule:
    # CADA HORA en punto. El horario ya no lo fija este cron: lo elige cada
    # admin en el panel (`bot_digest_config.hora_local` + `dias_semana`), y la
    # edge function pregunta en cada corrida a quién le toca y todavía no lo
    # recibió. Una corrida sin pendientes no manda nada y sale ok.
    #
    # GitHub llega tarde o se saltea corridas de este cron: por eso el resumen
    # sale en la PRIMERA corrida a partir de la hora elegida, no sólo dentro de
    # esa hora (#1309). Con la hora exacta, en 41 días salió 14.
    #
    # Antes era '0 10 * * *' (07:00 ART) para todos. Bajar la frecuencia aca
    # vuelve a hacer que el horario del panel no se respete.
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  disparar-digest:
    name: POST a telegram-digest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disparar digest
        env:
          TELEGRAM_DIGEST_KEY: ${{ secrets.TELEGRAM_DIGEST_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_DIGEST_KEY:-}" ]; then
            echo "::error::Falta el secret TELEGRAM_DIGEST_KEY. Cargalo en Settings > Secrets and variables > Actions (mismo valor que en Supabase Dashboard > Edge Functions > telegram-digest > Secrets)."
            exit 1
          fi
          curl -fsS -X POST \
            -H "X-Digest-Key: ${TELEGRAM_DIGEST_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"source":"github-actions"}' \
            https://hmuchlzmuqqxcldbzkgc.supabase.co/functions/v1/telegram-digest \
            -o response.json
          # #1550: la respuesta trae, por cada destinatario, su id de perfil y su
          # id de Telegram, y este repo es público: los logs y el resumen de una
          # corrida los lee cualquiera. Acá se imprimen sólo totales por estado
          # (como eval-bot.yml); el detalle queda en bot_digest_enviados.
          # Un motivo de error puede nombrar un id: se le tapan los números
          # largos y los uuid.
          node - <<'JS' > resumen.json 2>/dev/null || echo '{"aviso":"la respuesta no se pudo resumir (no es el JSON esperado)"}' > resumen.json
          const r = JSON.parse(require('fs').readFileSync('response.json', 'utf8'))
          const filas = Array.isArray(r.results) ? r.results : []
          const contar = (claves) => claves.reduce((a, k) => ((a[k] = (a[k] || 0) + 1), a), {})
          const sinIds = (t) => String(t)
            .replace(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/gi, '<uuid>')
            .replace(/[0-9]{5,}/g, '<id>')
          // Los otros dos avisos: sólo cuántos y en qué estado, si vienen como lista.
          const porEstado = (v) => (Array.isArray(v) ? contar(v.map((x) => (x && x.status) || 'sin_estado')) : undefined)
          console.log(JSON.stringify({
            ok: r.ok, fecha: r.fecha, hora: r.hora, dow: r.dow,
            error: r.error == null ? undefined : sinIds(r.error),
            destinatarios: filas.length,
            por_estado: contar(filas.map((x) => x.status || 'sin_estado')),
            motivos: contar(filas.filter((x) => x.reason != null).map((x) => sinIds(x.reason))),
            avisos_vencimiento: porEstado(r.avisos_vencimiento),
            avisos_atrasados: porEstado(r.avisos_atrasados),
          }))
          JS
          echo "Resumen de la respuesta (sin ids):"
          cat resumen.json

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Digest ejecutivo Telegram"
            echo "- Resultado: **${{ job.status }}**"
            if [ -f resumen.json ]; then
              echo ""
              echo '```json'
              cat resumen.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
